# PeopleHub pricing site + API + PostgreSQL.
# Run from this folder:  docker compose --env-file api/.env up -d --build
# Settings come from api/.env (copy api/.env.example). Inside compose the API reaches the database as host "db".
name: peoplehub-pricing

services:
  db:
    image: postgres:16-alpine
    container_name: peoplehub-pricing-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pricing-data:/var/lib/postgresql/data
      # Runs only when the data volume is brand new; creates the tables
      - ./api/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      # Published for pgAdmin on this PC. Remove this on the real server so the database is not reachable from outside.
      - "${DB_PUBLISHED_PORT:-5440}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    container_name: peoplehub-pricing-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - api/.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      # The built sales deck. Refresh it with: node scripts/sync-deck.js   (no image rebuild needed)
      - ./present:/app/present:ro
    ports:
      - "${API_PUBLISHED_PORT:-4400}:4400"

volumes:
  pricing-data:
    # Reuses the volume created when the database was first started with "docker run"
    name: peoplehub-pricing-data
    external: true
