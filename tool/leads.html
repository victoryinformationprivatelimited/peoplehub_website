<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Leads</title>
<style>
  .bar { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  .bar input[type=search] { max-width:300px; }
  .seg { display:inline-flex; background:var(--s3); border-radius:11px; padding:3px; gap:2px; }
  .seg button { border:none; background:none; padding:6px 14px; border-radius:9px; color:var(--muted); font-weight:650; box-shadow:none; }
  .seg button.on { background:var(--surface); color:var(--accent-d); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .today { margin-bottom:16px; } .today h2 { font-size:15px; }
  .trow { display:flex; align-items:center; gap:12px; padding:9px 0; border-top:1px solid var(--border); }
  .trow:first-of-type { border-top:none; } .trow b { font-weight:650; } .trow small { color:var(--muted); }
  .trow a { text-decoration:none; color:inherit; } .trow .sp { flex:1; }
  .due { font-size:11.5px; font-weight:700; padding:2px 9px; border-radius:99px; background:var(--neu-bg); color:var(--neu-fg); white-space:nowrap; }
  .due.over { background:var(--bad-bg); color:var(--bad-fg); } .due.now { background:var(--warn-bg); color:var(--warn-fg); }
  .board { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(250px,1fr); gap:14px; overflow-x:auto; padding-bottom:14px; align-items:start; }
  .col { background:var(--s3); border-radius:14px; padding:12px; min-height:200px; transition:background .15s; }
  .col.over { background:var(--soft); outline:2px dashed var(--accent); }
  .col h3 { margin:0 0 10px; display:flex; justify-content:space-between; align-items:baseline; text-transform:none; letter-spacing:0; font-size:14px; color:var(--text); }
  .col h3 small { color:var(--muted); font-weight:600; font-size:12px; }
  .card2 { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 13px; margin-bottom:9px; cursor:grab; box-shadow:0 1px 2px rgba(16,32,26,.05); }
  .card2:hover { border-color:var(--accent-bd); box-shadow:var(--shadow); } .card2.drag { opacity:.4; }
  .card2 b { display:block; line-height:1.3; } .card2 small { color:var(--muted); display:block; font-size:12.5px; }
  .card2 .meta { display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  .own { width:24px; height:24px; border-radius:50%; background:var(--soft); color:var(--accent-d); display:grid; place-items:center; font-size:11px; font-weight:750; margin-left:auto; }
  .tagp { font-size:11px; font-weight:700; background:var(--soft); color:var(--accent-d); padding:1px 8px; border-radius:99px; }
  #listView { display:none; } body.list #listView { display:block; } body.list #boardView { display:none; }
  tr.lk { cursor:pointer; } tr.lk:hover td { background:var(--hover); }
  dialog { border:none; border-radius:18px; padding:26px; width:min(560px,94vw); box-shadow:0 24px 70px rgba(0,0,0,.35); }
  dialog::backdrop { background:rgba(10,20,17,.55); }
  dialog .grid { margin:12px 0; }
  .warn { background:var(--warn); border:1px solid var(--warn-bd); border-radius:10px; padding:10px 14px; margin:10px 0; font-size:13px; }
</style>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("ph-theme")||"dark"}catch(e){}</script>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div id="gate"><div class="box">
  <h2>Leads</h2><div class="hint">Sign in with your PeopleHub login.</div>
  <input type="text" id="gUser" placeholder="Username" autocomplete="username">
  <input type="password" id="gPass" placeholder="Password" autocomplete="current-password">
  <div class="err" id="gErr"></div><button class="primary" id="gGo">Log in</button>
</div></div>

<div class="wrap">
  <div class="top"><h1>Leads</h1><div class="sp"></div><button class="primary" id="newBtn">+ New lead</button></div>
  <div class="bar">
    <input type="search" id="q" placeholder="Search company, contact or email">
    <div class="seg" id="view"><button data-v="board" class="on">Board</button><button data-v="list">List</button></div>
    <label style="display:flex;gap:7px;align-items:center;margin:0;font-weight:600"><input type="checkbox" id="mine"> Only mine</label>
  </div>

  <div class="card today" id="todayCard" hidden><h2>Follow up today</h2><div id="todayList"></div></div>

  <div id="boardView"><div class="board" id="board"></div></div>
  <div id="listView"><div class="card"><div class="table-wrap"><table><thead><tr><th>Company</th><th>Contact</th><th>Stage</th><th style="text-align:right">Employees</th><th style="text-align:right">Est. monthly</th><th>Next follow-up</th><th>Owner</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
</div>

<dialog id="dlg">
  <h2>New lead</h2>
  <div class="hint">Registering a lead holds the company for you for 90 days. Activity renews it.</div>
  <div class="grid">
    <div style="grid-column:1/-1"><label>Company *</label><input type="text" id="nCo" maxlength="160"></div>
    <div><label>Contact name</label><input type="text" id="nName" maxlength="120"></div>
    <div><label>Job title</label><input type="text" id="nTitle" maxlength="120"></div>
    <div><label>Email</label><input type="email" id="nEmail" maxlength="160"></div>
    <div><label>Phone</label><input type="text" id="nPhone" maxlength="40"></div>
    <div><label>Employees</label><input type="number" id="nEmp" min="0"></div>
    <div><label>Expected monthly value (USD)</label><input type="number" id="nVal" min="0"></div>
    <div><label>Industry</label><input type="text" id="nInd" maxlength="120"></div>
    <div><label>Source</label><select id="nSrc"><option value="">—</option><option>Referral</option><option>Website</option><option>Event</option><option>Cold call</option><option>Existing client</option><option>Social media</option><option>Other</option></select></div>
    <div style="grid-column:1/-1"><label>Notes</label><textarea id="nNotes" maxlength="4000" style="min-height:60px"></textarea></div>
  </div>
  <div class="warn" id="nWarn" hidden></div>
  <div style="display:flex;gap:10px;justify-content:flex-end;align-items:center"><span class="msg" id="nMsg"></span><button id="nCancel">Cancel</button><button class="primary" id="nSave">Register lead</button></div>
</dialog>

<script src="shell.js"></script>
<script src="app.js"></script>
<script>
(function(){
  var $ = PH.$, esc = PH.esc, money = PH.money;
  var STAGES = [['new', 'New'], ['contacted', 'Contacted'], ['qualified', 'Qualified'], ['proposal', 'Proposal'], ['won', 'Won'], ['lost', 'Lost']];
  var leads = [], me = null;
  function ini(n){ return String(n || '?').trim().split(/\s+/).slice(0, 2).map(function(w){ return w.charAt(0); }).join('').toUpperCase(); }
  function today(){ return new Date().toLocaleDateString('en-CA'); }
  function dueChip(d){
    if (!d) return '';
    var s = String(d).slice(0, 10), t = today();
    return '<span class="due ' + (s < t ? 'over' : s === t ? 'now' : '') + '">' + (s < t ? 'Overdue ' : s === t ? 'Due today' : 'Due ') + (s === t ? '' : new Date(s + 'T00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })) + '</span>';
  }
  function load(){
    var q = $('q').value.trim(), qs = '?' + (q ? 'q=' + encodeURIComponent(q) + '&' : '') + ($('mine').checked ? 'mine=1' : '');
    PH.api('GET', '/api/leads' + qs).then(function(r){ leads = r.json || []; draw(); });
  }
  function card(l){
    return '<div class="card2" draggable="true" data-id="' + l.id + '"><b>' + esc(l.company_name) + '</b><small>' + esc(l.contact_name || 'No contact yet') + '</small>' +
      '<div class="meta">' + (l.employees ? '<span class="hint" style="margin:0">' + l.employees.toLocaleString() + ' staff</span>' : '') + (l.est_value ? '<span class="hint" style="margin:0">' + money(l.est_value).replace('.00', '') + '/mo</span>' : '') +
      dueChip(l.next_due) + (l.partner_name && me.role !== 'partner' ? '<span class="tagp">' + esc(l.partner_name) + '</span>' : '') + '<span class="own" title="' + esc(l.owner_name) + '">' + esc(ini(l.owner_name)) + '</span></div></div>';
  }
  function draw(){
    $('board').innerHTML = STAGES.map(function(s){
      var items = leads.filter(function(l){ return l.stage === s[0]; });
      var val = items.reduce(function(t, l){ return t + (+l.est_value || 0); }, 0);
      return '<div class="col" data-stage="' + s[0] + '"><h3>' + s[1] + '<small>' + items.length + (val ? ' · ' + money(val).replace('.00', '') : '') + '</small></h3>' + items.map(card).join('') + '</div>';
    }).join('');
    $('rows').innerHTML = leads.map(function(l){
      return '<tr class="lk" data-id="' + l.id + '"><td><b>' + esc(l.company_name) + '</b></td><td>' + esc(l.contact_name || '') + '</td><td><span class="tag">' + esc(l.stage) + '</span></td><td style="text-align:right">' + (l.employees || '') + '</td><td style="text-align:right">' + (l.est_value ? money(l.est_value) : '') + '</td><td>' + dueChip(l.next_due) + '</td><td class="hint">' + esc(l.owner_name) + '</td></tr>';
    }).join('') || '<tr><td class="hint">No leads yet. Register your first one.</td></tr>';
  }
  function loadToday(){
    PH.api('GET', '/api/tasks?scope=overdue').then(function(a){
      PH.api('GET', '/api/tasks?scope=today').then(function(b){
        var t = (a.json || []).concat(b.json || []).slice(0, 6);
        $('todayCard').hidden = !t.length;
        $('todayList').innerHTML = t.map(function(x){
          return '<div class="trow"><input type="checkbox" data-done="' + x.id + '" title="Mark done"><div><b>' + esc(x.title) + '</b><br><small>' + esc(x.lead_name || x.customer_name || '') + '</small></div><span class="sp"></span>' + dueChip(x.due_date) + (x.lead_id ? '<a href="lead.html?id=' + x.lead_id + '"><button>Open</button></a>' : '') + '</div>';
        }).join('') + '<div style="margin-top:6px"><a href="followups.html">All follow-ups →</a></div>';
      });
    });
  }
  $('todayList').addEventListener('change', function(e){ if (e.target.dataset.done) PH.api('PUT', '/api/tasks/' + e.target.dataset.done, { done: true }).then(function(){ loadToday(); load(); if (window.PHShell) PHShell.refreshBadge && PHShell.refreshBadge(); }); });

  // open / drag between stages
  document.addEventListener('click', function(e){ var c = e.target.closest('[data-id]'); if (c && (c.classList.contains('card2') || c.classList.contains('lk'))) location.href = 'lead.html?id=' + c.dataset.id; });
  var dragId = null;
  $('board').addEventListener('dragstart', function(e){ var c = e.target.closest('.card2'); if (!c) return; dragId = c.dataset.id; c.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (x) {} });
  $('board').addEventListener('dragend', function(){ document.querySelectorAll('.drag,.over').forEach(function(x){ x.classList.remove('drag', 'over'); }); });
  $('board').addEventListener('dragover', function(e){ var c = e.target.closest('.col'); if (!c) return; e.preventDefault(); document.querySelectorAll('.col.over').forEach(function(x){ x.classList.remove('over'); }); c.classList.add('over'); });
  $('board').addEventListener('drop', function(e){
    var c = e.target.closest('.col'); if (!c || !dragId) return; e.preventDefault();
    var to = c.dataset.stage, l = leads.filter(function(x){ return String(x.id) === dragId; })[0];
    if (!l || l.stage === to) return;
    var body = { stage: to };
    if (to === 'lost') { var why = prompt('Why was this lead lost?'); if (why === null) return; body.reason = why; }
    PH.api('PUT', '/api/leads/' + l.id + '/stage', body).then(function(r){ if (r.status !== 200) alert(r.json.error || 'Could not move the lead'); load(); });
  });

  $('view').addEventListener('click', function(e){ var b = e.target.closest('button'); if (!b) return; [].forEach.call($('view').children, function(x){ x.classList.toggle('on', x === b); }); document.body.classList.toggle('list', b.dataset.v === 'list'); try { localStorage.setItem('ph_leadview', b.dataset.v); } catch (x) {} });
  var qt; $('q').addEventListener('input', function(){ clearTimeout(qt); qt = setTimeout(load, 250); });
  $('mine').addEventListener('change', load);

  // new lead
  var force = false;
  function fields(){ return { company_name: $('nCo').value, contact_name: $('nName').value, contact_title: $('nTitle').value, email: $('nEmail').value, phone: $('nPhone').value, employees: $('nEmp').value, est_value: $('nVal').value, industry: $('nInd').value, source: $('nSrc').value, notes: $('nNotes').value, force: force }; }
  $('newBtn').addEventListener('click', function(){ force = false; $('nWarn').hidden = true; $('nMsg').textContent = ''; $('nSave').textContent = 'Register lead'; $('dlg').showModal(); $('nCo').focus(); });
  $('nCancel').addEventListener('click', function(){ $('dlg').close(); });
  $('nSave').addEventListener('click', function(){
    PH.api('POST', '/api/leads', fields()).then(function(r){
      if (r.status === 201) { $('dlg').close(); ['nCo','nName','nTitle','nEmail','nPhone','nEmp','nVal','nInd','nNotes'].forEach(function(i){ $(i).value = ''; }); location.href = 'lead.html?id=' + r.json.id; return; }
      var j = r.json || {};
      if (r.status === 409 && (j.code === 'duplicate' || j.code === 'held_by_partner')) {
        var ex = (j.existing || [])[0];
        $('nWarn').hidden = false;
        $('nWarn').innerHTML = esc(j.error) + (ex && ex.kind === 'lead' ? ' <a href="lead.html?id=' + ex.id + '">Open it</a>' : '') + (j.code === 'held_by_partner' ? '' : ' To register it again anyway, press the button once more.');
        force = true; $('nSave').textContent = 'Register anyway'; PH.say($('nMsg'), '', false);
      } else { $('nWarn').hidden = true; PH.say($('nMsg'), j.error || 'Could not save', false); }
    });
  });

  PH.boot(function(user){
    me = user;
    try { if (localStorage.getItem('ph_leadview') === 'list') { document.body.classList.add('list'); [].forEach.call($('view').children, function(x){ x.classList.toggle('on', x.dataset.v === 'list'); }); } } catch (x) {}
    load(); loadToday();
  });
})();
</script>
</body>
</html>
